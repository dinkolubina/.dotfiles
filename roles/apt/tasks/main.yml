- name: Upgrade apt
  apt: upgrade=yes
  when: 
    - not ansible_check_mode
    - package_upgrade
  become: yes
  become_user: root
  become_method: sudo

- name: Install apt packages
  apt:
    name: "{{ packages }}"
    update_cache: yes
  become: yes
  become_user: root
  become_method: sudo
  when: not ansible_check_mode

- name: Remove apt packages
  apt:
    name: "{{ remove_packages }}"
    state: absent
  become: yes
  become_user: root
  become_method: sudo
  when: not ansible_check_mode

- name: Create ~/.local/bin directory for bat
  file:
    path: "{{ dotfiles_user_home }}/.local/bin"
    state: directory

- name: Add bat symlink to repoint from batcat
  file:
    src: "/usr/bin/batcat"
    dest: "{{ dotfiles_user_home }}/.local/bin/bat"
    state: link

# Regolith 3 reads user config from ~/.config/regolith3/.
# Files in i3/config.d/ are included after Regolith's own defaults, so we add
# a partial instead of copying and patching the whole i3 config.
- name: Create Regolith config directories
  file:
    path: "{{ dotfiles_user_home }}/.config/regolith3/i3/config.d"
    state: directory

- name: Link custom Regolith Xresources
  file:
    src: "{{ dotfiles_home }}/roles/apt/files/Xresources"
    dest: "{{ dotfiles_user_home }}/.config/regolith3/Xresources"
    state: link

- name: Link custom Regolith i3 partial
  file:
    src: "{{ dotfiles_home }}/roles/apt/files/config"
    dest: "{{ dotfiles_user_home }}/.config/regolith3/i3/config.d/90_custom"
    state: link

- name: Link fdfind to fd
  file:
    src: "/usr/bin/fdfind"
    dest: "{{ dotfiles_user_home }}/.local/bin/fd"
    state: link
