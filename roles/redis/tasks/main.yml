- name: Install package
  apt:
    name:
      - redis-server
    update_cache: yes
  become: yes
  become_user: root
  become_method: sudo
  when: not ansible_check_mode

- name: Enable and start redis-server
  systemd:
    name: redis-server
    enabled: yes
    state: started
  become: yes
  become_user: root
  become_method: sudo
  when: not ansible_check_mode
