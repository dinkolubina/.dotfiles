- name: Install zsh
  apt: name=zsh state=present
  become: yes
  become_user: root
  become_method: sudo
  when: not ansible_check_mode

- name: Install oh-my-zsh
  shell: 'KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended'
  args:
    creates: "{{ dotfiles_user_home }}/.oh-my-zsh"
  when: not ansible_check_mode

- name: Check for .zshrc
  stat: path="{{dotfiles_user_home}}/.zshrc"
  register: zshrc_stat

- name: Back up .zshrc
  command: mv ~/.zshrc ~/.zshrc.bak
  args:
    creates: "{{dotfiles_user_home}}/.zshrc.bak"
  when: zshrc_stat.stat.exists and not zshrc_stat.stat.islnk

- name: Symlink .zshrc
  file:
    src: "{{ dotfiles_home }}/roles/zsh/files/zshrc"
    dest: "{{dotfiles_user_home}}/.zshrc"
    state: link
    force: yes

- name: Powerlevel10k theme installation
  git:
    repo: https://github.com/romkatv/powerlevel10k.git
    dest: "{{ dotfiles_user_home }}/.oh-my-zsh/custom/themes/powerlevel10k"
    depth: 1

- name: Symlink .p10k.zsh
  file:
    src: "{{ dotfiles_home }}/roles/zsh/files/p10k.zsh"
    dest: "{{dotfiles_user_home}}/.p10k.zsh"
    state: link

- name: Set zsh as the default shell
  user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/zsh
  become: yes
  become_user: root
  become_method: sudo
  when: not ansible_check_mode
